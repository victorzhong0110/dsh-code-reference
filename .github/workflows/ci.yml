name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 语法检查（三个插件文件）
        run: |
          node --check plugins/core.mjs
          node --check plugins/tools.mjs
          node --check plugins/decision.mjs
      - name: 单元测试（纯函数 + 扫描边界 + API mock）
        run: node --test test/core.test.mjs
      - name: 政策文件 JSON 合法性
        run: node -e "JSON.parse(require('fs').readFileSync('.code-reference-policy.json','utf8')); console.log('policy JSON OK')"
