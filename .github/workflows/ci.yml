name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.19.0', 24]
    steps:
      # 固定到 commit SHA（供应链安全）：actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js ${{ matrix.node-version }}
        # actions/setup-node v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: ${{ matrix.node-version }}
      - name: 语法检查（三个插件文件）
        run: |
          node --check plugins/core.mjs
          node --check plugins/tools.mjs
          node --check plugins/decision.mjs
      - name: 单元测试（core 纯函数/扫描边界/API mock + decision 流程）
        run: node --test test/core.test.mjs test/decision.test.mjs
      - name: 政策文件 JSON 合法性
        run: node -e "for (const f of ['.code-reference-policy.json','.code-reference-policy.enterprise.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log(f, 'OK') }"
      - name: bundle manifest 校验（dsh.bundle → patch → 插件文件）
        run: node scripts/check-bundle.mjs
      - name: SHA256SUMS 与 Release 附件一致性
        run: shasum -a 256 -c SHA256SUMS
